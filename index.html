<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康康和江江的浪漫小窝</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #ab47bc; /* 紫藤萝意境点缀 */
            --bg-color: #f1f8e9;
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-color: #2c3e50;
            --shadow: 0 8px 32px 0 rgba(46, 125, 50, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 50%, #f3e5f5 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 90px;
            position: relative;
            overflow-x: hidden;
        }

        /* 顶部与周围的紫藤萝花瀑布装饰边框 */
        body::before {
            content: "🌿 🌸 🌿 🌸 🌿 🌸 🌿 🌸 🌿 🌸 🌿 🌸 🌿 🌸 🌿 🌸";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            font-size: 1.1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            padding: 5px 0;
            z-index: 1000;
            letter-spacing: 5px;
            box-shadow: 0 2px 10px rgba(171, 71, 188, 0.1);
        }

        header {
            text-align: center;
            padding: 45px 20px 20px;
        }

        header h1 {
            font-size: 1.9rem;
            color: #2e7d32;
            margin-bottom: 5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        header p {
            font-size: 0.9rem;
            color: #558b2f;
        }

        .container {
            max-width: 600px;
            margin: 10px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(165, 214, 167, 0.4);
            position: relative;
        }

        .card::after {
            content: "🌸";
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 浪漫倒计时模块（融入自然绿与紫藤萝渐变） */
        .countdown-box {
            text-align: center;
            background: linear-gradient(135deg, #66bb6a 0%, #ab47bc 100%);
            color: white;
            border-radius: 16px;
            padding: 25px 15px;
            box-shadow: 0 10px 20px rgba(102, 187, 106, 0.3);
        }

        .countdown-box h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .days-number {
            font-size: 3.2rem;
            font-weight: bold;
            line-height: 1.2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .days-label {
            font-size: 0.9rem;
            opacity: 0.95;
            margin-top: 5px;
        }

        /* 头像与双人相册展示区 */
        .couple-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
            text-align: center;
        }

        .avatar-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e8f5e9;
            border: 2px dashed #81c784;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin: 0 auto 5px;
            cursor: pointer;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .avatar-label {
            font-size: 0.8rem;
            color: #558b2f;
            font-weight: bold;
        }

        /* 三餐打卡样式 */
        .meal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .meal-item {
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .meal-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: #388e3c;
            margin-bottom: 8px;
        }

        .meal-photo-area {
            width: 100%;
            height: 90px;
            background: #f1f8e9;
            border-radius: 8px;
            border: 2px dashed #a5d6a7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .meal-photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .meal-photo-area span {
            font-size: 1.5rem;
            color: #81c784;
        }

        .meal-photo-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* 备忘录样式 */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .todo-input-group input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #a5d6a7;
            outline: none;
            font-size: 0.9rem;
            background: #fff;
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #fff;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #c8e6c9;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: #9e9e9e;
        }

        .todo-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 8px;
        }

        /* 每日文章样式 */
        .article-box h3 {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .article-box p {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .article-comment textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #a5d6a7;
            resize: none;
            outline: none;
            font-size: 0.9rem;
            margin-bottom: 8px;
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 康康和江江的小窝 🌸</h1>
        <p>藤蔓缠绕岁岁年年，微风记录点点滴滴 ✨</p>
    </header>

    <div class="container">
        <!-- 头像互动区 -->
        <div class="card">
            <div class="couple-header">
                <div>
                    <div class="avatar-box" id="avatar-kang-box">
                        <span id="avatar-kang-icon">👤</span>
                        <input type="file" accept="image/*" onchange="uploadAvatar('kang', event)">
                    </div>
                    <div class="avatar-label">康康</div>
                </div>
                <div style="font-size: 1.5rem; color: #ab47bc;"> 💜 </div>
                <div>
                    <div class="avatar-box" id="avatar-jiang-box">
                        <span id="avatar-jiang-icon">👤</span>
                        <input type="file" accept="image/*" onchange="uploadAvatar('jiang', event)">
                    </div>
                    <div class="avatar-label">江江</div>
                </div>
            </div>
        </div>

        <!-- 1. 浪漫倒计时模块 -->
        <div class="card">
            <div class="card-title">
                <span>⏳ 距离下次见面还有</span>
            </div>
            <div class="countdown-box">
                <h2>浪漫相见倒计时</h2>
                <div class="days-number" id="daysCount">--</div>
                <div class="days-label">天</div>
            </div>
        </div>

        <!-- 2. 一日三餐打卡模块 -->
        <div class="card">
            <div class="card-title">🍽️ 今日三餐温馨打卡</div>
            <div class="meal-grid">
                <div class="meal-item">
                    <div class="meal-name">早餐 🍳</div>
                    <div class="meal-photo-area" id="meal-breakfast-box">
                        <span id="meal-breakfast-icon">+</span>
                        <input type="file" accept="image/*" onchange="uploadMeal('breakfast', event)">
                    </div>
                </div>
                <div class="meal-item">
                    <div class="meal-name">午餐 🥗</div>
                    <div class="meal-photo-area" id="meal-lunch-box">
                        <span id="meal-lunch-icon">+</span>
                        <input type="file" accept="image/*" onchange="uploadMeal('lunch', event)">
                    </div>
                </div>
                <div class="meal-item">
                    <div class="meal-name">晚餐 🍲</div>
                    <div class="meal-photo-area" id="meal-dinner-box">
                        <span id="meal-dinner-icon">+</span>
                        <input type="file" accept="image/*" onchange="uploadMeal('dinner', event)">
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 提醒与待办模块 -->
        <div class="card">
            <div class="card-title">📝 专属备忘录</div>
            <div class="todo-input-group">
                <input type="text" id="todoInput" placeholder="写下要提醒对方做的事...">
                <button class="btn" onclick="addTodo()">添加</button>
            </div>
            <ul class="todo-list" id="todoList">
                <!-- 动态生成 -->
            </ul>
        </div>

        <!-- 4. 每日文章与写作打卡 -->
        <div class="card">
            <div class="card-title">📖 每日美文与写作陪伴</div>
            <div class="article-box">
                <h3 id="articleTitle">加载中...</h3>
                <p id="articleContent">加载中...</p>
                <div class="article-comment">
                    <textarea id="articleNote" placeholder="写下今天的读后感或一句心情..."></textarea>
                    <button class="btn" onclick="saveNote()" style="float: right; padding: 6px 14px; font-size: 0.85rem;">保存感悟</button>
                    <div style="clear: both;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 倒计时计算
        let targetMeetDate = '2026-10-01';
        function updateCountdown() {
            const now = new Date();
            const target = new Date(targetMeetDate);
            const diffTime = target - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').innerText = diffDays >= 0 ? diffDays : 0;
        }
        updateCountdown();

        // 头像上传
        function uploadAvatar(person, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById(`avatar-${person}-box`);
                    box.innerHTML = `<img src="${e.target.result}" alt="头像"><input type="file" accept="image/*" onchange="uploadAvatar('${person}', event)">`;
                    localStorage.setItem(`avatar_${person}`, e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        ['kang', 'jiang'].forEach(person => {
            const savedAvatar = localStorage.getItem(`avatar_${person}`);
            if (savedAvatar) {
                const box = document.getElementById(`avatar-${person}-box`);
                if(box) {
                    box.innerHTML = `<img src="${savedAvatar}" alt="头像"><input type="file" accept="image/*" onchange="uploadAvatar('${person}', event)">`;
                }
            }
        });

        // 三餐图片上传
        function uploadMeal(mealType, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById(`meal-${mealType}-box`);
                    box.innerHTML = `<img src="${e.target.result}" alt="打卡图片"><input type="file" accept="image/*" onchange="uploadMeal('${mealType}', event)">`;
                    localStorage.setItem(`meal_${mealType}`, e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        ['breakfast', 'lunch', 'dinner'].forEach(meal => {
            const savedImg = localStorage.getItem(`meal_${meal}`);
            if (savedImg) {
                const box = document.getElementById(`meal-${meal}-box`);
                if(box) {
                    box.innerHTML = `<img src="${savedImg}" alt="打卡图片"><input type="file" accept="image/*" onchange="uploadMeal('${meal}', event)">`;
                }
            }
        });

        // 待办事项
        let todos = JSON.parse(localStorage.getItem('todos')) || [
            { text: '记得今晚睡前给对方打电话 💜', completed: false }
        ];

        function renderTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <span>${todo.text}</span>
                    <div class="todo-actions">
                        <button onclick="toggleTodo(${index})">${todo.completed ? '↩️' : '✅'}</button>
                        <button onclick="deleteTodo(${index})">❌</button>
                    </div>
                `;
                list.appendChild(li);
            });
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (input.value.trim() !== '') {
                todos.push({ text: input.value, completed: false });
                input.value = '';
                renderTodos();
            }
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            renderTodos();
        }

        renderTodos();

        // 每日美文
        const dailyArticles = [
            { title: "《紫藤萝瀑布》节选意境", content: "“花朵一串挨着一串，一朵接着一朵，彼此推着挤着，好不活泼繁茂！” —— 愿我们的生活像这春意一样，生机盎然、充满诗意。" },
            { title: "关于陪伴", content: "陪伴是最长情的告白，把普通的每一天过得热气腾腾，就是对生活最好的情书。" },
            { title: "浪漫的事", content: "我能想到最浪漫的事，就是和你一起吃很多很多顿饭，看日落，数星星，把平凡的日子变成童话。" }
        ];

        const todayIndex = new Date().getDate() % dailyArticles.length;
        document.getElementById('articleTitle').innerText = dailyArticles[todayIndex].title;
        document.getElementById('articleContent').innerText = dailyArticles[todayIndex].content;

        function saveNote() {
            const note = document.getElementById('articleNote').value;
            if(note.trim() !== '') {
                localStorage.setItem('dailyNote', note);
                alert('读后感保存成功！🌿');
            } else {
                alert('请先写点什么再保存哦~');
            }
        }

        const savedNote = localStorage.getItem('dailyNote');
        if(savedNote) {
            document.getElementById('articleNote').value = savedNote;
        }
    </script>
</body>
</html>
